<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anvil Tools Admin</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Anvil Tools Admin</div>
    <div class="actions">
      <span id="userEmail" class="muted">Admin</span>
      <button class="btn secondary" id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Dashboard navigation">
      <a class="nav-item active" href="#overview">Overview</a>
      <a class="nav-item" href="#tools">Tools</a>
      <a class="nav-item" href="#posts">Posts</a>
      <a class="nav-item" href="#analytics">Analytics</a>
    </aside>

    <main class="content">
      <div id="dashboardMessage" class="dashboard-message" role="status" hidden></div>
      <section id="overview">
        <h2>Overview</h2>
        <div class="stats" id="statsGrid"><p class="muted">Loading dashboard?</p></div>
      </section>

      <section id="tools" class="panel" style="margin-top: 20px;">
        <h3>Tools</h3>
        <div id="toolsTable"></div>
      </section>

      <section id="posts" class="panel" style="margin-top: 20px;">
        <h3>Posts</h3>
        <form id="postForm">
          <label>Title
            <input type="text" id="postTitle" placeholder="Post title" required>
          </label>
          <label>Slug
            <input type="text" id="postSlug" placeholder="post-slug" required>
          </label>
          <label>Excerpt
            <textarea id="postExcerpt" placeholder="Short description"></textarea>
          </label>
          <label>Status
            <select id="postStatus">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>
          </label>
          <button class="btn primary" type="submit">Create post</button>
        </form>
        <div id="postsList" style="margin-top: 16px;"></div>
      </section>

      <section id="analytics" class="panel" style="margin-top: 20px;">
        <h3>Analytics</h3>
        <div id="analyticsChart"></div>
      </section>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const notice = document.getElementById('dashboardMessage');
    function showNotice(message, error = false) {
      notice.hidden = !message;
      notice.textContent = message;
      notice.classList.toggle('error', error);
    }
    document.querySelectorAll('.nav-item').forEach(link => link.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item === link));
    }));
    const statsGrid = document.getElementById('statsGrid');
    const toolsTable = document.getElementById('toolsTable');
    const postsList = document.getElementById('postsList');
    const analyticsChart = document.getElementById('analyticsChart');
    const userEmail = document.getElementById('userEmail');

    async function loadSession() {
      const res = await AnvilAPI.fetch('/api/admin/me');
      if (!res.ok) {
        window.location.href = '/admin-panel/login.html';
        return;
      }
      const data = await res.json();
      userEmail.textContent = data.user?.email || 'Admin';
      return true;
    }

    async function fetchJson(url) {
      const response = await AnvilAPI.fetch(url);
      if (response.status === 401) window.location.href = '/admin-panel/login.html';
      if (!response.ok) throw new Error('API request failed');
      return response.json();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function renderStats(data) {
      const cards = [
        { label: 'Tracked Tool Views', value: data.totalVisitors.toLocaleString() },
        { label: 'Average Session', value: data.avgSessionTime },
        { label: 'Top Source', value: data.topSource },
        { label: 'Total Tools', value: data.totalTools }
      ];

      statsGrid.innerHTML = cards.map((card) => `
        <div class="stat-card">
          <div class="stat-label">${card.label}</div>
          <div class="stat-value">${card.value}</div>
        </div>
      `).join('');
    }

    function renderTools(tools) {
      toolsTable.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Tool</th>
              <th>Category</th>
              <th>Views</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${tools.map((tool) => `
              <tr>
                <td>${escapeHtml(tool.name)}</td>
                <td>${escapeHtml(tool.category)}</td>
                <td>${tool.views || 0}</td>
                <td><span class="pill">${escapeHtml(tool.status || 'active')}</span></td>
                <td><button class="btn secondary small" data-tool="${escapeHtml(tool.slug)}">Edit</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      toolsTable.querySelectorAll('[data-tool]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const slug = btn.dataset.tool;
          const tool = tools.find((item) => item.slug === slug);
          const newName = prompt('Update tool name', tool.name);
          if (!newName) return;
          btn.disabled = true;
          try {
          const response = await AnvilAPI.fetch(`/api/tools/${slug}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...tool, name: newName })
          });
          if (!response.ok) throw new Error((await response.json()).error || 'Could not save tool.');
          await loadDashboard();
          showNotice('Tool updated.');
          } catch (error) { showNotice(error.message, true); }
          finally { btn.disabled = false; }
        });
      });
    }

    function renderPosts(posts) {
      if (!posts.length) { postsList.innerHTML = '<p class="muted">No posts yet. Create your first post above.</p>'; return; }
      postsList.innerHTML = posts.map((post) => `
        <div class="panel" style="margin-top: 12px;">
          <strong>${escapeHtml(post.title)}</strong>
          <div class="small muted">${escapeHtml(post.slug)} · ${escapeHtml(post.status)}</div>
          <p class="small">${escapeHtml(post.excerpt || 'No excerpt')}</p>
        </div>
      `).join('');
    }

    function renderAnalytics(data) {
      const items = data.toolBreakdown || [];
      analyticsChart.innerHTML = items.map((item) => `
        <div style="margin-bottom: 10px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
            <span>${escapeHtml(item.name)}</span>
            <strong>${item.views}</strong>
          </div>
          <div style="height: 10px; background: #eef2ff; border-radius: 999px; overflow: hidden;">
            <div style="width: ${(item.views / Math.max(...items.map(i => i.views), 1)) * 100}%; height: 100%; background: linear-gradient(90deg, #2563eb, #60a5fa); border-radius: 999px;"></div>
          </div>
        </div>
      `).join('');
    }

    async function loadDashboard() {
      const [overview, tools, posts] = await Promise.all([
        fetchJson('/api/site/overview'),
        fetchJson('/api/tools'),
        fetchJson('/api/posts')
      ]);

      renderStats(overview);
      renderTools(tools);
      renderPosts(posts);
      renderAnalytics(overview);
    }

    document.getElementById('postForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        title: document.getElementById('postTitle').value,
        slug: document.getElementById('postSlug').value,
        excerpt: document.getElementById('postExcerpt').value,
        status: document.getElementById('postStatus').value,
      };

      const button = event.currentTarget.querySelector('button[type=submit]');
      button.disabled = true;
      button.textContent = 'Saving?';
      try {
      const response = await AnvilAPI.fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (!response.ok) throw new Error((await response.json()).error || 'Could not create post.');
      document.getElementById('postForm').reset();
      await loadDashboard();
      showNotice('Post saved.');
      } catch (error) { showNotice(error.message, true); }
      finally { button.disabled = false; button.textContent = 'Create post'; }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try { await AnvilAPI.fetch('/api/admin/logout', { method: 'POST' }); }
      finally {
        AnvilAPI.clearSession();
        window.location.href = '/admin-panel/login.html';
      }
    });

    loadSession().then(authenticated => { if (authenticated) return loadDashboard(); })
      .catch(() => { statsGrid.innerHTML = ''; showNotice('Unable to load your dashboard. Check your connection and try reloading.', true); });
  </script>
</body>
</html>
