<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anvil Tools Admin Login</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="login-page">
  <main class="card">
    <a href="../index.html">&larr; Back to website</a>
    <h1>Anvil Tools</h1>
    <p>Sign in to manage your tools and posts.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button class="btn primary" type="submit">Sign in</button>
      <div id="message" class="msg" role="status"></div>
    </form>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      button.textContent = 'Signing in?';
      msg.textContent = '';
      msg.classList.remove('error');

      const payload = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      };

      try {
      const response = await AnvilAPI.fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await response.json();
      if (!response.ok) {
        msg.textContent = data.error || 'Login failed';
        msg.classList.add('error');
        return;
      }

      AnvilAPI.setSession(data);
      msg.textContent = 'Logged in.';
      window.location.href = '/admin-panel/index.html';
      } catch (error) {
        msg.textContent = 'Could not reach the API. Check the connection and API URL.';
        msg.classList.add('error');
      } finally {
        button.disabled = false;
        button.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
