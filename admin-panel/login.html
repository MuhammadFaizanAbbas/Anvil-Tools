<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anvil Tools Admin Login</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --surface: #ffffff;
      --primary: #2563eb;
      --muted: #64748b;
      --line: #e5e7eb;
      --success: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827 50%, #1d4ed8);
      color: #111827;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(420px, calc(100% - 30px));
      background: var(--surface);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 25px 70px rgba(15, 23, 42, 0.35);
    }
    h1 { margin: 0 0 10px; font-size: 2rem; }
    p { color: var(--muted); margin: 0 0 22px; }
    label { display: block; margin: 14px 0 8px; font-weight: 600; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      border: none;
      background: var(--primary);
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 18px;
    }
    .msg { margin-top: 14px; min-height: 22px; color: var(--success); font-weight: 600; }
    .msg.error { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Anvil Tools</h1>
    <p>Admin panel login</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="admin@yourdomain.com" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" value="admin123" required />

      <button type="submit">Login</button>
      <div id="message" class="msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      msg.textContent = '';
      msg.classList.remove('error');

      const payload = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      };

      const response = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await response.json();
      if (!response.ok) {
        msg.textContent = data.error || 'Login failed';
        msg.classList.add('error');
        return;
      }

      msg.textContent = 'Logged in.';
      window.location.href = '/admin';
    });
  </script>
</body>
</html>
